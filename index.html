<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Attendance Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen p-3">
    <div class="max-w-md mx-auto space-y-4">
        
        <div class="bg-white p-4 rounded-2xl shadow-sm flex justify-between items-center">
            <div>
                <h1 class="font-bold text-slate-800 text-lg">Site Attendance</h1>
                <p class="text-xs text-slate-500">Supervisor: <span id="supName" class="font-semibold text-slate-700">-</span></p>
            </div>
            <button onclick="setupSupervisor()" class="text-xs bg-slate-100 px-3 py-1.5 rounded-lg font-medium text-slate-600">Change</button>
        </div>

        <button onclick="startScanner()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-5 rounded-2xl shadow-lg flex items-center justify-center gap-3 text-xl cursor-pointer">
            <i data-lucide="qr-code" class="w-8 h-8"></i>
            SCAN WORKER QR
        </button>

        <button onclick="syncOfflineScans()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl flex items-center justify-center gap-2 text-sm cursor-pointer">
            <i data-lucide="refresh-cw" class="w-4 h-4"></i> Upload Offline Logs (<span id="pendingCount">0</span>)
        </button>

        <div class="bg-white p-4 rounded-2xl shadow-sm space-y-3">
            <h2 class="font-bold text-slate-800 text-sm flex justify-between">
                <span>Scanned Today</span>
                <span id="presentCount" class="bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full text-xs">0</span>
            </h2>
            <div id="logList" class="divide-y divide-slate-100 text-sm max-h-60 overflow-y-auto">
                <p class="text-slate-400 text-center py-4 text-xs">No scans yet today.</p>
            </div>
        </div>
    </div>

    <!-- Scanner Modal -->
    <div id="scanModal" class="fixed inset-0 bg-black/80 hidden flex-col items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl p-4 w-full max-w-sm space-y-4">
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-slate-800">Point Camera at QR Badge</h3>
                <button onclick="stopScanner()" class="bg-slate-100 p-2 rounded-full"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div id="reader" class="w-full rounded-xl overflow-hidden bg-black"></div>
            <p id="scanStatus" class="text-center font-semibold text-sm text-slate-600">Opening camera...</p>
        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwjq8_wF5wSsgv4M3r79cK1oKJ3_qsBozAGiJfsY8Xbd7-TiEvvJLP6t6kITn2qQUNk3w/exec";
        let roster = JSON.parse(localStorage.getItem("offline_roster") || "[]");
        let offlineQueue = JSON.parse(localStorage.getItem("offline_queue") || "[]");
        let qrScanner = null;

        function setupSupervisor() {
            let name = prompt("Enter Supervisor Name:", localStorage.getItem("sup_name") || "");
            let loc = prompt("Enter Location / Site Zone:", localStorage.getItem("sup_loc") || "");
            if (name) localStorage.setItem("sup_name", name);
            if (loc) localStorage.setItem("sup_loc", loc);
            document.getElementById("supName").textContent = (localStorage.getItem("sup_name") || "Not set") + " (" + (localStorage.getItem("sup_loc") || "No zone") + ")";
        }

        async function fetchRoster() {
            if (!navigator.onLine) return;
            try {
                let res = await fetch(WEB_APP_URL);
                let data = await res.json();
                if (data.roster) {
                    roster = data.roster;
                    localStorage.setItem("offline_roster", JSON.stringify(roster));
                }
            } catch(e) {}
        }

        function startScanner() {
            if (!localStorage.getItem("sup_name")) setupSupervisor();
            document.getElementById("scanModal").classList.remove("hidden");
            document.getElementById("scanModal").classList.add("flex");
            
            qrScanner = new Html5Qrcode("reader");
            qrScanner.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 250 } },
                onScanSuccess
            ).catch(err => {
                document.getElementById("scanStatus").textContent = "Camera error: Allow camera access.";
            });
        }

        function stopScanner() {
            if (qrScanner) {
                qrScanner.stop().then(() => {
                    qrScanner.clear();
                    document.getElementById("scanModal").classList.add("hidden");
                    document.getElementById("scanModal").classList.remove("flex");
                }).catch(() => {});
            }
        }

        function onScanSuccess(decodedText) {
            let empId = decodedText.trim();
            let worker = roster.find(w => w.id === empId);

            let record = {
                id: empId,
                name: worker ? worker.name : "Unknown",
                designation: worker ? worker.designation : "-",
                company: worker ? worker.company : "-",
                status: "PRESENT",
                supervisor: localStorage.getItem("sup_name"),
                location: localStorage.getItem("sup_loc"),
                timestamp: new Date().toISOString()
            };

            // Save to Local Queue
            offlineQueue.push(record);
            localStorage.setItem("offline_queue", JSON.stringify(offlineQueue));
            
            updateUI();
            document.getElementById("scanStatus").textContent = "✅ Saved: " + record.name;
            setTimeout(stopScanner, 1000);

            // Attempt online sync
            if (navigator.onLine) syncOfflineScans();
        }

        async function syncOfflineScans() {
            if (offlineQueue.length === 0) {
                alert("No pending offline scans.");
                return;
            }
            
            let queueCopy = [...offlineQueue];
            for (let item of queueCopy) {
                try {
                    await fetch(WEB_APP_URL, {
                        method: "POST",
                        mode: "no-cors",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(item)
                    });
                } catch(e) {
                    break; 
                }
            }

            offlineQueue = [];
            localStorage.setItem("offline_queue", JSON.stringify([]));
            updateUI();
            alert("All offline attendance logs uploaded to Google Sheet!");
        }

        function updateUI() {
            document.getElementById("pendingCount").textContent = offlineQueue.length;
            document.getElementById("presentCount").textContent = offlineQueue.length;
            let list = document.getElementById("logList");
            if (offlineQueue.length > 0) list.innerHTML = "";
            offlineQueue.forEach(item => {
                list.innerHTML = `<div class="py-2 flex justify-between items-center"><span class="font-medium text-slate-800">${item.name}</span><span class="text-xs text-slate-400">${item.id}</span></div>` + list.innerHTML;
            });
        }

        document.addEventListener("DOMContentLoaded", () => {
            if (window.lucide) lucide.createIcons();
            setupSupervisor();
            fetchRoster();
            updateUI();
        });
    </script>
</body>
</html>
